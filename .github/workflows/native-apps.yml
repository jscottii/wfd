# Builds the iPhone and Android apps from app/ on every push that changes them.
#  - Android: a debug APK you can install on an Android phone (download it from the run's Artifacts).
#  - iOS: compiles for the simulator to prove the project builds. Store uploads need the signing secrets in STORE_SETUP.md.
name: Native apps
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/native-apps.yml']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build:native && npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: meal-prep-android-debug, path: app/android/app/build/outputs/apk/debug/app-debug.apk }
  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run build:native && npx cap sync ios
      - name: Add the Live Activity widget
        run: (gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj --no-document) && ruby scripts/add-live-activity.rb
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
